# Build - Scan - Plan - Approve - Apply - Deploy for LearningSteps.
#
#   secrets ──┐
#   lint-test ├──> terraform-plan ──> terraform-apply ──> build-scan-push ──> deploy
#   iac-scan ─┘                       (approval; Terraform   (push only        (main only)
#                                      + platform layer;      on main)
#                                      only if something
#                                      changed)
#
# Pull requests: checks, terraform plan, build and image scan. No apply, no
#                push, no deploy.
# Push to main:  everything. terraform-apply waits for a manual approval in the
#                GitHub environment "infrastructure" and only runs when the
#                Terraform plan has changes or the Kubernetes platform layer
#                (k8s-manifests/platform.yaml, k8s-manifests/monitoring/) changed.
#
# Azure sign-in uses OIDC (no stored password) with three identities from
# infra-bootstrap/, each allowed only what its job needs:
#   AZURE_CLIENT_ID_TERRAFORM_PLAN   read only                       (main, pull requests)
#   AZURE_CLIENT_ID_TERRAFORM_APPLY  change the app resource group   (environment "infrastructure")
#   AZURE_CLIENT_ID                  push images, deploy the app     (main, environment "production")
#                                    layer into its namespace only
# plus AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID. All are repository
# variables; none of them is a secret.
#
# Third-party actions are pinned to a commit SHA (with the version as a
# comment): a moved tag or a compromised release cannot change what runs here.

name: pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["notizen/**", "hints & guide/**", "**.md"]
  pull_request:
    paths-ignore: ["notizen/**", "hints & guide/**", "**.md"]
  workflow_dispatch: {}          # manual start, e.g. after a rebuild

permissions:
  contents: read                 # default for all jobs; widened per job only where needed

env:
  RESOURCE_GROUP: rg-learningsteps-dev
  IMAGE_NAME: learningsteps-api
  TRIVY_VERSION: v0.74.0
  TERRAFORM_VERSION: 1.16.3
  # Terraform (provider and state backend) signs in with the job's OIDC token.
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"

jobs:
  # ---------------------------------------------------------------- 1. checks
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0         # whole history: a secret removed later is still leaked
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No report as a downloadable artifact: in a public repository any
          # GitHub user can download artifacts, and a report of a real finding
          # would point to the leaked secret. Findings still fail the job and
          # appear in the job log and summary.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:                  # throwaway database for the tests
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: learning_journal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/learning_journal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"   # same as the image
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests scripts
      - name: Test (pytest)
        run: pytest -v tests

  iac-scan:
    name: Config and dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Misconfigurations in Terraform, Kubernetes manifests, Dockerfile
        # Accepted risks with reason and expiry date: .trivyignore.yaml
        run: >-
          trivy config --severity HIGH,CRITICAL --exit-code 1
          --ignorefile .trivyignore.yaml .
      - name: Known vulnerabilities in the Python dependencies
        run: >-
          trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 .

  # ------------------------------------------------------- 2. infrastructure
  terraform-plan:
    name: Terraform plan
    needs: [secrets, lint-test, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_PLAN }}
    defaults:
      run:
        working-directory: infra-terraform
    outputs:
      has_changes: ${{ steps.result.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0         # history, to see whether platform.yaml changed
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false   # keep terraform's own exit codes
      - run: terraform init -input=false
      - name: Plan
        id: plan
        # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
        # -lock=false: plan only reads; the lock stays free for apply.
        run: |
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode -no-color -out=tfplan
          code=$?
          set -e
          [ "$code" -eq 1 ] && exit 1
          echo "changed=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Platform layer changed?
        id: platform
        # The platform layer (namespace, service accounts, Key Vault binding,
        # network policies, monitoring) is applied by terraform-apply, so a
        # change to it needs the approval too. A manual run always re-applies it.
        working-directory: ${{ github.workspace }}
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push)         range="$BEFORE..$GITHUB_SHA" ;;
            pull_request) range="$BASE...$GITHUB_SHA" ;;
            *)            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # exit code 0 = unchanged; anything else (changed, or history not
          # comparable) counts as changed
          if git diff --quiet "$range" -- k8s-manifests/platform.yaml k8s-manifests/monitoring/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Result
        id: result
        run: |
          echo "Terraform changes: ${{ steps.plan.outputs.changed }}, platform layer changed: ${{ steps.platform.outputs.changed }}"
          if [ "${{ steps.plan.outputs.changed }}" = true ] || [ "${{ steps.platform.outputs.changed }}" = true ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Show the plan in the run summary
        # Sensitive values (password, connection string) appear as
        # "(sensitive value)". The binary plan file is NOT uploaded: it would
        # contain them in plain text, and artifacts of a public repository can
        # be downloaded by any GitHub user.
        run: |
          {
            echo "## Terraform plan"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-apply:
    name: Terraform apply (approval)
    needs: terraform-plan
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      && needs.terraform-plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: infrastructure   # required reviewer: the job waits for approval
    concurrency: terraform        # never two applies at the same time
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_APPLY }}
    defaults:
      run:
        working-directory: infra-terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false
      # Plans again and applies. The saved plan from the plan job is not
      # reused (see above); approve shortly after reading the plan summary.
      - run: terraform apply -input=false -auto-approve -no-color

      # Platform layer (needs cluster admin, which only this identity and the
      # admin have). kubectl signs in through az (OIDC) and kubelogin.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_TERRAFORM_APPLY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: v0.2.20
      - name: Apply the Kubernetes platform layer
        working-directory: ${{ github.workspace }}
        env:
          VALUES_FROM: azure
        run: ./k8s-manifests/deploy.sh --platform

  # ------------------------------------------------------ 3. build, scan, push
  build-scan-push:
    name: Build, scan and push image
    needs: [terraform-plan, terraform-apply]
    # Runs when the plan succeeded and apply either succeeded or was not
    # needed (skipped). Without this condition a skipped apply would skip
    # everything after it.
    if: >-
      !cancelled() && needs.terraform-plan.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.terraform-apply.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write            # request the OIDC token for the Azure sign-in
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Scan image before pushing
        # --ignore-unfixed: vulnerabilities without an available fix (mostly in
        # the Debian base image) cannot be fixed by us and do not fail the run.
        run: >-
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          "$IMAGE_NAME:${{ github.sha }}"

      - name: Azure sign-in (OIDC)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push to ACR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          ACR_NAME="$(az acr list -g "$RESOURCE_GROUP" --query '[0].name' -o tsv)"
          ACR_SERVER="$(az acr list -g "$RESOURCE_GROUP" --query '[0].loginServer' -o tsv)"
          az acr login --name "$ACR_NAME"
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$ACR_SERVER/$IMAGE_NAME:${{ github.sha }}"
          docker push "$ACR_SERVER/$IMAGE_NAME:${{ github.sha }}"

  # ------------------------------------------------------------- 4. deploy
  deploy:
    name: Deploy to AKS
    needs: build-scan-push
    # Explicit result check: with a skipped terraform-apply further up, the
    # implicit success() would skip this job as well.
    if: >-
      !cancelled() && needs.build-scan-push.result == 'success'
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production           # deployment history on GitHub
      url: ${{ steps.smoke.outputs.url }}
    concurrency: deploy          # never two deployments at the same time
    permissions:
      contents: read
      id-token: write
    env:
      VALUES_FROM: azure         # deploy.sh reads names from Azure, no Terraform needed here
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: v0.2.20
      - name: Apply the app layer with the new image
        run: ./k8s-manifests/deploy.sh
      - name: Wait for the rollout
        # Without this step the job would be green as soon as kubectl sent the
        # manifest, not when the new pods actually run.
        run: kubectl rollout status deployment/learningsteps-api -n learningsteps --timeout=300s
      - name: Database schema (idempotent)
        run: ./k8s-manifests/deploy.sh --db-init
      - name: Demo data (only if the database is empty)
        run: ./k8s-manifests/deploy.sh --seed
      - name: Smoke test from outside
        id: smoke
        run: |
          IP="$(kubectl get ingress learningsteps-api -n learningsteps -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          curl --fail --silent --show-error "http://$IP/health"
          curl --fail --silent --show-error --output /dev/null "http://$IP/entries"
          echo "url=http://$IP/docs" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ github.sha }} to http://$IP"
